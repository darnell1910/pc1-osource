<section class="page-not-found" aria-labelledby="page-not-found-title">
  <h1 id="page-not-found-title" class="page-title">{{ 'page-not-found.title' | translate }}</h1>
  <p class="page-not-found-message" role="alert">{{ 'page-not-found.message' | translate: {path: invalidPath} }}</p>
  <button mat-flat-button type="button" (click)="navigateToHome()">
    <mat-icon aria-hidden="true">home</mat-icon>
    {{ 'page-not-found.go-home' | translate }}
  </button>
</section>
