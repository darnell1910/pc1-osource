<mat-toolbar class="layout-toolbar" role="banner">
  @if (isHandset()) {
    <button mat-icon-button type="button" (click)="toggleSidenav()"
            [attr.aria-label]="'toolbar.toggle-navigation' | translate"
            [attr.aria-expanded]="sidenavOpened()" aria-controls="main-sidenav">
      <mat-icon aria-hidden="true">menu</mat-icon>
    </button>
  }
  <img class="toolbar-logo" [src]="logoPath" [alt]="'toolbar.logo-alt' | translate" width="40" height="40">
  <span class="toolbar-title">{{ 'toolbar.title' | translate }}</span>
  <span class="toolbar-spacer" aria-hidden="true"></span>
  <app-language-switcher/>
</mat-toolbar>

<mat-sidenav-container class="layout-container">
  <mat-sidenav id="main-sidenav" class="layout-sidenav"
               [mode]="isHandset() ? 'over' : 'side'"
               [opened]="sidenavOpened()"
               (openedChange)="onSidenavOpenedChange($event)">
    <nav [attr.aria-label]="'navigation.label' | translate">
      <mat-nav-list>
        @for (option of options; track option.link) {
          <a mat-list-item [routerLink]="option.link" routerLinkActive="active-link"
             #routerLinkActive="routerLinkActive" [activated]="routerLinkActive.isActive"
             [attr.aria-current]="routerLinkActive.isActive ? 'page' : null" (click)="onNavigate()">
            <mat-icon matListItemIcon aria-hidden="true">{{ option.icon }}</mat-icon>
            <span matListItemTitle>{{ option.label | translate }}</span>
          </a>
        }
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="layout-content-shell">
    <main class="layout-content">
      <router-outlet/>
    </main>
    <app-footer-content/>
  </mat-sidenav-content>
</mat-sidenav-container>
